[project]
name = "fizzbuzz-api"
version = "0.1.0"
description = "fizzbuzz api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "pydantic (>=2.14.0,<3.0.0)"
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "import-linter (>=2.15,<3.0)"
]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Domain package isolation - no imports from outside domain/application"
type = "forbidden"
source_modules = [
    "src.domain",
]
forbidden_modules = [
    "src.adapters",
]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]